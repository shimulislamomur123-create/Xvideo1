{% extends "videos/base.html" %}

{% block title %}Login | XVideos{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Welcome Back</h1>
    <p>Login to your account.</p>

    {% if form.errors %}
        <p style="color: red;">
            Username or password is incorrect.
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account?
        <a href="{% url 'signup' %}">Sign Up</a>
    </p>
</div>

<style>
.auth-box {
    max-width: 450px;
    margin: 50px auto;
    padding: 30px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 18px;
}
.auth-box h1 { margin-top: 0; }
.auth-box input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
}
.auth-box button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 9px;
    background: var(--primary);
    color: white;
    cursor: pointer;
}
.auth-box a { color: var(--primary); }
</style>
{% endblock %}
